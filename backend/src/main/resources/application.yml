spring:
  application:
    name: truthnet-ai-backend
  data:
    neo4j:
      uri: ${NEO4J_URI:bolt://localhost:7687}
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:password}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  error:
    include-message: always

truthnet:
  jwt:
    secret: ${JWT_SECRET:9a4f2c8d3b7a1e5f8c2e6d9b0a3f4e7c1b5d8e2f9a3c6b0d1e4f7a2c5b8d0e3f}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
  tesseract:
    data-path: ${TESSERACT_DATA_PATH:tessdata}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
